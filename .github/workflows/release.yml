name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "di-v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, test and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve project and version
        id: target
        run: |
          case "$GITHUB_REF_NAME" in
            di-v*)
              echo "project=src/Axios.Net.Extensions.DependencyInjection/Axios.Net.Extensions.DependencyInjection.csproj" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#di-v}" >> "$GITHUB_OUTPUT"
              echo "prop=DiVersion" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "project=src/Axios.Net/Axios.Net.csproj" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
              echo "prop=Version" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Restore
        run: dotnet restore Axios.Net.slnx

      - name: Build
        run: dotnet build Axios.Net.slnx --configuration Release --no-restore -p:${{ steps.target.outputs.prop }}=${{ steps.target.outputs.version }}

      - name: Test
        run: dotnet test Axios.Net.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: >
          dotnet pack ${{ steps.target.outputs.project }}
          --configuration Release
          --no-build
          --output artifacts
          -p:${{ steps.target.outputs.prop }}=${{ steps.target.outputs.version }}

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

          dotnet nuget push "artifacts/*.snupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          if [[ "${{ steps.target.outputs.version }}" == *-* ]]; then
            prerelease="--prerelease"
          fi

          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
